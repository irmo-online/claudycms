name: Funktionswunsch
description: Eine Idee oder Verbesserung vorschlagen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem willst du lösen?
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Wie stellst du dir die Lösung vor?
  - type: textarea
    id: alternativen
    attributes:
      label: Alternativen
